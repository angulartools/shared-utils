<div class="alert-wrapper" [class]="type()">
  <mat-dialog-content class="alert-body">
    <div class="alert-header-row">
      <div class="alert-badge" aria-hidden="true">
        <i [class]="iconClass()"></i>
      </div>

      <div class="alert-text-col">
        @if (title()) {
          <h2 class="alert-title">{{ title() }}</h2>
        }

        @if (message()) {
          <p class="alert-message">{{ message() }}</p>
        }

        @if (isInput()) {
          <input
            class="alert-input"
            [(ngModel)]="inputValue"
            matInput
            [placeholder]="placeholder()"
            type="text"
          />
        }
      </div>
    </div>
  </mat-dialog-content>

  <div class="alert-actions-row">
    @if (hasCancel()) {
      <button
        type="button"
        mat-stroked-button
        class="cancel-btn"
        (click)="cancel()">
        {{ cancelText() }}
      </button>
    }

    <button
      type="button"
      mat-flat-button
      class="confirm-btn"
      (click)="confirm()">
      {{ confirmText() }}
    </button>
  </div>
</div>
