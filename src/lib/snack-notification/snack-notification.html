<div class="snackbar"
     [class.snackbar-success]="data.type === 'success'"
     [class.snackbar-error]="data.type === 'error'"
     [class.snackbar-warning]="data.type === 'warning'"
     [class.snackbar-info]="data.type === 'info'">

  @switch (data.type) {
    @case ('success') { <i class="snackbar-icon fa-solid fa-circle-check"></i> }
    @case ('error') { <i class="snackbar-icon fa-solid fa-circle-xmark"></i> }
    @case ('warning') { <i class="snackbar-icon fa-solid fa-triangle-exclamation"></i> }
    @case ('info') { <i class="snackbar-icon fa-solid fa-circle-info"></i> }
  }

  <span class="snackbar-message">
    {{ data.message }}
  </span>

</div>
